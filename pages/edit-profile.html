<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile | LocalHire</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <div id="navbar-container"></div>

    <main class="container animate-fade-in" style="padding: 3rem 1.5rem; max-width: 800px; margin: 0 auto;">
        
        <div class="flex items-center justify-between" style="margin-bottom: 2rem;">
            <div>
                <h2>Set Up Your Profile</h2>
                <p class="text-muted">Complete your worker profile so customers can find and hire you.</p>
            </div>
        </div>

        <form id="profile-form" class="glass-card" style="padding: 2.5rem;">
            
            <!-- Profile Photo Section -->
            <div class="flex items-center gap-6" style="margin-bottom: 2.5rem; padding-bottom: 2rem; border-bottom: 1px solid var(--border-light); flex-wrap: wrap;">
                <div class="relative" style="width: 100px; height: 100px; border-radius: 50%; overflow: hidden; border: 3px solid var(--primary); background: var(--bg-dark); flex-shrink: 0;">
                    <img id="avatar-preview" src="" alt="Profile Preview" style="width: 100%; height: 100%; object-fit: cover; display: none;">
                    <div id="avatar-placeholder" style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; font-weight: bold; color: var(--primary);">?</div>
                </div>

                <div style="flex-grow: 1; min-width: 240px;">
                    <h4 style="margin: 0 0 0.25rem 0;">Profile Picture</h4>
                    <p class="text-muted" style="font-size: 0.85rem; margin-bottom: 1rem;">Upload a JPG, PNG, or WebP image up to 5 MB.</p>
                    
                    <div class="flex gap-3 items-center flex-wrap">
                        <label for="avatar-input" class="btn btn-outline" style="cursor: pointer; padding: 0.5rem 1rem; font-size: 0.85rem;">
                            <svg class="icon" viewBox="0 0 24 24" style="margin-right: 6px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                            Choose Photo
                        </label>
                        <input type="file" id="avatar-input" accept="image/jpeg,image/png,image/webp,image/jpg" style="display: none;">

                        <button type="button" id="btn-upload-avatar" class="btn btn-primary" style="display: none; padding: 0.5rem 1.25rem; font-size: 0.85rem;">
                            Upload
                        </button>
                        <button type="button" id="btn-cancel-avatar" class="btn btn-outline" style="display: none; padding: 0.5rem 1rem; font-size: 0.85rem;">
                            Cancel
                        </button>
                        <button type="button" id="btn-remove-avatar" class="btn btn-outline" style="display: none; padding: 0.5rem 1rem; font-size: 0.85rem; color: #ef4444; border-color: rgba(239,68,68,0.4);">
                            Remove
                        </button>
                    </div>

                    <p id="avatar-msg" style="display: none; font-size: 0.85rem; margin-top: 0.75rem;"></p>
                </div>
            </div>

            <div class="grid grid-cols-1 md-grid-cols-2 gap-6" style="margin-bottom: 2rem;">
                <div class="form-group">
                    <label class="form-label" for="category">Main Profession / Category</label>
                    <select id="category" class="input-control" required style="background-color: var(--bg-dark);">
                        <option value="">Select a category...</option>
                        <option value="Tutor">Tutor / Teacher</option>
                        <option value="Electrician">Electrician</option>
                        <option value="Plumber">Plumber</option>
                        <option value="Driver">Driver / Chauffeur</option>
                        <option value="Cleaner">Cleaner / Housekeeper</option>
                        <option value="Designer">Designer / Creative</option>
                        <option value="Handyman">Handyman</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="hourlyRate">Hourly Rate ($)</label>
                    <input type="number" id="hourlyRate" class="input-control" min="5" max="500" placeholder="e.g. 45" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="experience">Experience Level</label>
                    <select id="experience" class="input-control" required style="background-color: var(--bg-dark);">
                        <option value="">Select level...</option>
                        <option value="Entry (0-2 years)">Entry (0-2 years)</option>
                        <option value="Intermediate (3-5 years)">Intermediate (3-5 years)</option>
                        <option value="Expert (5+ years)">Expert (5+ years)</option>
                        <option value="Master (10+ years)">Master (10+ years)</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="phone">Phone Number (Optional)</label>
                    <input type="tel" id="phone" class="input-control" placeholder="(555) 123-4567">
                </div>
            </div>

            <div class="form-group" style="margin-bottom: 2rem;">
                <label class="form-label" for="skills">Skills (Comma separated)</label>
                <input type="text" id="skills" class="input-control" placeholder="e.g. Calculus, Physics, Exam Prep" required>
            </div>

            <div class="form-group" style="margin-bottom: 2rem;">
                <label class="form-label" for="bio">About You / Bio</label>
                <textarea id="bio" class="input-control" rows="4" placeholder="Tell customers about your experience, approach, and why they should hire you..." required></textarea>
            </div>

            <div class="grid grid-cols-1 md-grid-cols-2 gap-6" style="margin-bottom: 3rem;">
                <div class="form-group">
                    <label class="form-label" for="availability">Availability</label>
                    <input type="text" id="availability" class="input-control" placeholder="e.g. Available Mon-Fri, or Available Today" required>
                </div>

                <div class="form-group relative">
                    <label class="form-label">Location sharing</label>
                    <div class="flex gap-2">
                        <button type="button" id="btn-getloc" class="btn btn-outline" style="flex-grow: 1;">
                            <svg class="icon" viewBox="0 0 24 24" style="margin-right: 8px;"><polygon points="3 11 22 2 13 21 11 13 3 11"></polygon></svg>
                            Get My Location
                        </button>
                    </div>
                    <p id="loc-status" class="text-muted" style="font-size: 0.8rem; margin-top: 0.5rem;"></p>
                    <label class="flex items-center gap-2" style="margin-top: 0.75rem;">
                        <input type="checkbox" id="location-sharing">
                        <span>Share my location with nearby customers</span>
                    </label>
                    <label class="flex items-center gap-2" style="margin-top: 0.5rem;">
                        <input type="checkbox" id="worker-available">
                        <span>Available for nearby requests</span>
                    </label>
                </div>
            </div>

            <div class="flex justify-end gap-3" style="border-top: 1px solid var(--border-light); padding-top: 2rem;">
                <a href="../index.html" class="btn btn-outline" style="padding: 0.8rem 2rem;">Cancel</a>
                <button type="submit" class="btn btn-primary" style="padding: 0.8rem 2rem;">Save Profile</button>
            </div>
            
            <p id="save-msg" style="display: none; color: #10b981; margin-top: 1rem; text-align: right;">Profile saved successfully!</p>
        </form>

    </main>

    <script src="../js/data.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            renderNavbar('navbar-container', 'pages');

            const user = window.localHireApp.getCurrentUser();
            
            if (!user) {
                window.location.href = 'auth.html';
                return;
            }

            if (user.role !== 'Worker') {
                alert("Only Workers need to set up public profiles.");
                window.location.href = '../index.html';
                return;
            }

            // Pre-fill existing data if any
            if (user.category) document.getElementById('category').value = user.category;
            if (user.hourlyRate) document.getElementById('hourlyRate').value = user.hourlyRate;
            if (user.experience) document.getElementById('experience').value = user.experience;
            if (user.phone) document.getElementById('phone').value = user.phone;
            if (user.skills && user.skills.length > 0) document.getElementById('skills').value = user.skills.join(', ');
            if (user.bio) document.getElementById('bio').value = user.bio;
            if (user.availability) document.getElementById('availability').value = user.availability;

            // Avatar Preview & Upload Logic
            const avatarPreview = document.getElementById('avatar-preview');
            const avatarPlaceholder = document.getElementById('avatar-placeholder');
            const avatarInput = document.getElementById('avatar-input');
            const btnUploadAvatar = document.getElementById('btn-upload-avatar');
            const btnCancelAvatar = document.getElementById('btn-cancel-avatar');
            const btnRemoveAvatar = document.getElementById('btn-remove-avatar');
            const avatarMsg = document.getElementById('avatar-msg');

            const renderCurrentAvatar = () => {
                const currentUser = window.localHireApp.getCurrentUser();
                if (currentUser && currentUser.avatarUrl) {
                    avatarPreview.src = currentUser.avatarUrl;
                    avatarPreview.style.display = 'block';
                    avatarPlaceholder.style.display = 'none';
                    btnRemoveAvatar.style.display = 'inline-block';
                } else {
                    avatarPreview.src = '';
                    avatarPreview.style.display = 'none';
                    avatarPlaceholder.textContent = (currentUser?.name || user?.name || '?').charAt(0).toUpperCase();
                    avatarPlaceholder.style.display = 'flex';
                    btnRemoveAvatar.style.display = 'none';
                }
            };

            renderCurrentAvatar();

            let pendingFile = null;

            avatarInput.addEventListener('change', (e) => {
                const file = e.target.files?.[0];
                if (!file) return;

                // Validate file type
                const validTypes = ['image/jpeg', 'image/png', 'image/webp', 'image/jpg'];
                if (!validTypes.includes(file.type.toLowerCase())) {
                    avatarMsg.textContent = 'Invalid file type. Please select a JPG, PNG, or WebP image.';
                    avatarMsg.style.color = '#ef4444';
                    avatarMsg.style.display = 'block';
                    avatarInput.value = '';
                    return;
                }

                // Validate file size (5MB)
                if (file.size > 5 * 1024 * 1024) {
                    avatarMsg.textContent = 'Image exceeds 5 MB. Please choose a smaller photo.';
                    avatarMsg.style.color = '#ef4444';
                    avatarMsg.style.display = 'block';
                    avatarInput.value = '';
                    return;
                }

                pendingFile = file;
                const reader = new FileReader();
                reader.onload = (evt) => {
                    avatarPreview.src = evt.target.result;
                    avatarPreview.style.display = 'block';
                    avatarPlaceholder.style.display = 'none';
                    btnUploadAvatar.style.display = 'inline-block';
                    btnCancelAvatar.style.display = 'inline-block';
                    btnRemoveAvatar.style.display = 'none';
                    avatarMsg.textContent = `Ready to upload: ${file.name} (${(file.size / 1024).toFixed(0)} KB)`;
                    avatarMsg.style.color = '#94a3b8';
                    avatarMsg.style.display = 'block';
                };
                reader.readAsDataURL(file);
            });

            btnCancelAvatar.addEventListener('click', () => {
                pendingFile = null;
                avatarInput.value = '';
                btnUploadAvatar.style.display = 'none';
                btnCancelAvatar.style.display = 'none';
                avatarMsg.style.display = 'none';
                renderCurrentAvatar();
            });

            btnUploadAvatar.addEventListener('click', async () => {
                if (!pendingFile) return;

                btnUploadAvatar.disabled = true;
                btnUploadAvatar.textContent = 'Uploading...';
                avatarMsg.textContent = 'Uploading to storage...';
                avatarMsg.style.color = '#38bdf8';
                avatarMsg.style.display = 'block';

                try {
                    const res = await window.localHireAPI.uploadAvatar(pendingFile);
                    if (res && res.success) {
                        avatarMsg.textContent = 'Profile picture updated successfully!';
                        avatarMsg.style.color = '#10b981';
                        btnUploadAvatar.style.display = 'none';
                        btnCancelAvatar.style.display = 'none';
                        pendingFile = null;
                        avatarInput.value = '';
                        renderNavbar('navbar-container', 'pages');
                        renderCurrentAvatar();
                    } else {
                        throw new Error(res?.message || 'Upload failed.');
                    }
                } catch (err) {
                    console.error('[Avatar Upload]', err);
                    avatarMsg.textContent = err.message || 'Failed to upload photo.';
                    avatarMsg.style.color = '#ef4444';
                } finally {
                    btnUploadAvatar.disabled = false;
                    btnUploadAvatar.textContent = 'Upload';
                }
            });

            btnRemoveAvatar.addEventListener('click', async () => {
                if (!confirm('Are you sure you want to remove your profile photo?')) return;

                btnRemoveAvatar.disabled = true;
                avatarMsg.textContent = 'Removing photo...';
                avatarMsg.style.color = '#94a3b8';
                avatarMsg.style.display = 'block';

                try {
                    const res = await window.localHireAPI.deleteAvatar();
                    if (res && res.success) {
                        avatarMsg.textContent = 'Profile photo removed.';
                        avatarMsg.style.color = '#10b981';
                        renderNavbar('navbar-container', 'pages');
                        renderCurrentAvatar();
                    } else {
                        throw new Error(res?.message || 'Failed to remove photo.');
                    }
                } catch (err) {
                    console.error('[Avatar Delete]', err);
                    avatarMsg.textContent = err.message || 'Failed to remove photo.';
                    avatarMsg.style.color = '#ef4444';
                } finally {
                    btnRemoveAvatar.disabled = false;
                }
            });
            
            const sharingInput = document.getElementById('location-sharing');
            const availableInput = document.getElementById('worker-available');
            const btnLoc = document.getElementById('btn-getloc');
            const locStatus = document.getElementById('loc-status');
            let capturedLocation = null;

            try {
                const locationState = await window.localHireAPI.getMyLocationSharing();
                sharingInput.checked = locationState.sharingEnabled;
                availableInput.checked = locationState.isAvailable;
                locStatus.textContent = locationState.sharingEnabled
                    ? 'Location sharing is enabled. Get a fresh GPS fix before saving to go online.'
                    : 'Location is not shared until you enable it.';
            } catch (error) {
                locStatus.textContent = error.message;
                locStatus.style.color = '#ef4444';
            }

            const captureLocation = () => new Promise((resolve, reject) => {
                if (!navigator.geolocation) {
                    reject(new Error('Geolocation is not supported by this browser.'));
                    return;
                }

                navigator.geolocation.getCurrentPosition((position) => {
                    capturedLocation = {
                        latitude: position.coords.latitude,
                        longitude: position.coords.longitude,
                        accuracy: position.coords.accuracy
                    };
                    resolve(capturedLocation);
                }, (error) => {
                    const messages = {
                        1: 'Location permission was denied. Allow location access in your browser to share GPS.',
                        2: 'Your location is currently unavailable. Try again or check your device GPS.',
                        3: 'The location request timed out. Try again when GPS reception is available.'
                    };
                    reject(new Error(messages[error.code] || 'Could not get your location.'));
                }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 });
            });

            btnLoc.addEventListener('click', async () => {
                btnLoc.innerHTML = `<svg class="icon animate-spin" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-6.219-8.56"></path></svg> Locating...`;
                try {
                    await captureLocation();
                    locStatus.textContent = 'GPS fix captured. Save to update your sharing status.';
                    locStatus.style.color = '#10b981';
                } catch (error) {
                    locStatus.textContent = error.message;
                    locStatus.style.color = '#ef4444';
                } finally {
                    btnLoc.innerHTML = `<svg class="icon" viewBox="0 0 24 24" style="margin-right: 8px;"><polygon points="3 11 22 2 13 21 11 13 3 11"></polygon></svg> Get My Location`;
                }
            });

            // Form Submit
            const form = document.getElementById('profile-form');
            const saveMsg = document.getElementById('save-msg');
            const submitButton = form.querySelector('button[type="submit"]');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();

                if (submitButton.disabled) return;

                if (sharingInput.checked && availableInput.checked && !capturedLocation) {
                    try {
                        await captureLocation();
                    } catch (error) {
                        locStatus.textContent = error.message;
                        locStatus.style.color = '#ef4444';
                        return;
                    }
                }

                const updates = {
                    category: document.getElementById('category').value,
                    hourlyRate: parseFloat(document.getElementById('hourlyRate').value),
                    experience: document.getElementById('experience').value,
                    phone: document.getElementById('phone').value,
                    skills: document.getElementById('skills').value.split(',').map(s => s.trim()).filter(s => s),
                    bio: document.getElementById('bio').value,
                    availability: document.getElementById('availability').value,
                    rating: user.rating || 5.0,
                    reviewsCount: user.reviewsCount || 1,
                    location: 'Nearby'
                };

                submitButton.disabled = true;
                submitButton.textContent = 'Saving...';
                saveMsg.style.display = 'none';
                saveMsg.style.color = '#10b981';
                saveMsg.textContent = '';

                try {
                    if (!window.localHireAPI || typeof window.localHireAPI.updateProfile !== 'function') {
                        throw new Error('Profile API is unavailable.');
                    }

                    const result = await window.localHireAPI.updateProfile(updates);
                    if (!result || !result.success) {
                        throw new Error(result && result.message ? result.message : 'Could not update profile.');
                    }

                    await window.localHireAPI.updateMyLocationSharing({
                        sharingEnabled: sharingInput.checked,
                        isAvailable: availableInput.checked,
                        ...(sharingInput.checked && availableInput.checked ? capturedLocation : {})
                    });

                    saveMsg.textContent = 'Profile saved successfully!';
                    saveMsg.style.display = 'block';
                    setTimeout(() => {
                        window.location.href = `profile.html?id=${user.id}`;
                    }, 1000);
                } catch (error) {
                    console.error('[Profile Page] Save failed:', error);
                    saveMsg.textContent = error && error.message ? error.message : 'Could not save profile. Please try again.';
                    saveMsg.style.display = 'block';
                    saveMsg.style.color = '#ef4444';
                } finally {
                    submitButton.disabled = false;
                    submitButton.textContent = 'Save Profile';
                }
            });
        });
    </script>
</body>
</html>
